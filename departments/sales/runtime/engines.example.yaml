# Subscription/OAuth engines only. Runtime code substitutes {prompt} as one
# argv element without invoking a shell. No metered API lane may be added.
codex_oauth:
  command:
    - codex
    - exec
    - --sandbox
    - read-only
    - "{prompt}"
  auth_class: oauth_cli
  auth_probe: []
claude_subscription:
  command:
    - claude
    - -p
    - --output-format
    - json
    - --no-session-persistence
    - "{prompt}"
  auth_class: oauth_cli
  auth_probe: []
