# pulse — Stage 3 Creation Contract (acceptance run, throwaway department)
destination:
  statement: "pulse exists as a governed shadow department created purely through the ratified 12-stage process, then deletes cleanly."
  binary_exit_test: "python3 loopfactory.py prove --name pulse exits 0 on the assembled department; both injected incidents route correctly; every run record shows external_actions_taken=0; deletion leaves no registry entry."
  proof_department: pulse
proof_loop: pulse-daily-digest
owner: ankit
factory_version_target: "v2"
privacy_external_effect_boundary: "Fixture notes only; zero external sends, writes, publishes, or spend; no enabled timers; no real data."

canonical_authorities:
  transition: kernel.transition
  run_identity: factory.records
  telemetry: factory.records
  eval_policy: charter.eval_policy
  eval_evidence: factory.evaluation
  board_projection: factory.board
  healing: factory.manager
  escalation: kernel.outbox

f1_answers:
  - question_id: F1-PROVING-SLICE
    answer: "The daily digest loop over fixture inbox notes is the proving slice."
    source: departments/pulse/creation/map.md
  - question_id: F1-CADENCE
    answer: "Daily 07:00 time trigger, Persistent=false, catch_up skip, never enabled during acceptance."
    source: departments/pulse/creation/tickets/D1-cadence.md
  - question_id: F1-ASK-RETURN-PATH
    answer: "One ask class clarify_note with return_path digest_builder and return_sla_hours 48."
    source: departments/pulse/creation/tickets/D2-ask-return-path.md
open_questions:
  - question_id: F1-FULL-INTERVIEW-PENDING
    blocking: false

proof_matrix:
  - stage: contract-validation
    gate: "loopfactory.py creation-contract check exits zero on this file."
  - stage: governance-validation
    gate: "loopfactory.py validate --name pulse exits zero."
  - stage: objectives
    gate: "loopfactory.py objectives --name pulse exits zero after the shadow cycle writes observations."
  - stage: cadence
    gate: "loopfactory.py cadence check exits zero and rendered units contain no systemctl and Persistent=false."
  - stage: runtime-build
    gate: "Ringer build unit checks execute green; node QA checks pass on fixtures."
  - stage: shadow-proof
    gate: "loopfactory.py prove --name pulse exits zero; run records show external_actions_taken=0."

decision_sources:
  - departments/pulse/creation/map.md
  - departments/pulse/creation/tickets/D1-cadence.md
  - departments/pulse/creation/tickets/D2-ask-return-path.md
