# Subscription/OAuth engines only. Runtime code substitutes {prompt} with the
# full prompt as one argv element without invoking a shell. {prompt_file}
# remains available for engines that explicitly require a file path.
codex_oauth:
  - codex
  - exec
  - --sandbox
  - read-only
  - "{prompt}"
claude_subscription:
  - claude
  - -p
  - --disable-slash-commands
  - --exclude-dynamic-system-prompt-sections
  - --output-format
  - text
  - --no-session-persistence
  - "{prompt}"
