entries:
  - id: social
    owner: "Ankit"
    surface: "department"
    schedule: "daily via source-controlled social-loop.timer; deployment state unverified"
    health_check: "test -f departments/social/state/STATE.json"
    heartbeat_path: "departments/social/state/heartbeats.jsonl"
    state_dir: "departments/social/state"
    kill_switch: "systemctl --user disable --now social-loop.timer"
