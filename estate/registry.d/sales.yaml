entries:
  - id: sales
    owner: "Ankit"
    surface: "department"
    schedule: "*:00/30 via sales-loop.timer (systemd user; installed disabled — owner enables; Ankit cadence decision 2026-08-07)"
    health_check: "test -f departments/sales/state/STATE.json"
    heartbeat_path: "departments/sales/state/heartbeats.jsonl"
    state_dir: "departments/sales/state"
    kill_switch: "systemctl --user disable --now sales-loop.timer"
